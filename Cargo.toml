[package]
name = "grid_graphs"
version = "0.1.0"
edition = "2021"
[dependencies]
hashbrown = "0.14"
fxhash = "0.2"
anyhow = "1"
plotly = { version = "0.10", default-features = true }
rayon = "1"
varisat = "0.2"
varisat-dimacs = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Aggressive optimization for this DP-heavy search.
opt-level = 3           # Explicit (default) but keep here for clarity
lto = "fat"             # Cross-crate inlining
codegen-units = 1       # Better optimization at cost of compile time
panic = "abort"         # Smaller / a bit faster
strip = true            # Remove symbols
